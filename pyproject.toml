[project]
name = "thump"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "redis>=5.2",
    "cronsim>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thump"]

[tool.pytest.ini_options]
# No pythonpath here on purpose: tests run against the installed
# package, so a missing or stale editable install fails loudly instead of
# being silently masked. Run `uv sync --extra dev` first.
asyncio_mode = "auto"
