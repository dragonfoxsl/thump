name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A real Redis so the probe-lease integration tests run against actual
    # SET NX PX expiry, not fakeredis's approximation of it.
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true

      # .python-version pins 3.12 — the same version the image ships, so CI
      # cannot pass on a Python the container never runs.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      # --locked above already fails if uv.lock is stale relative to
      # pyproject.toml. That is deliberate: a lockfile that drifts silently
      # defeats the point of shipping resolved versions in the image.

      - name: Lint
        run: uv run ruff check src tests

      - name: Type-check
        run: uv run mypy

      # The coverage floor rides inside pytest (addopts --cov-fail-under), so
      # this step also fails if coverage drops below it. REDIS_URL flips the
      # real-Redis integration tests on (they skip themselves when it is unset).
      - name: Run tests
        env:
          REDIS_URL: redis://localhost:6379/15
        run: uv run pytest -q

      - name: Verify the example config actually loads
        run: |
          uv run python -c "
          from thump.config import load_config
          cfg = load_config('config.example.yaml',
                            {'THUMP_SECRET': 'x', 'THUMP_ADMIN_TOKEN': 'y'})
          print(f'{len(cfg.checks)} checks parsed')
          "

  docker:
    runs-on: ubuntu-latest
    # Never publish an image whose tests failed. This also gates the PR-time
    # build, which costs a little wall-clock and buys a guarantee that
    # anything reaching GHCR passed the suite first.
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write        # keyless cosign signing via OIDC
      attestations: write    # build provenance attestation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # Registers QEMU so the arm64 stage can execute during the build.
      # Without this, arm64 fails with "exec format error".
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
      # Pinned to a commit SHA, not a mutable tag: this step runs in the job
      # that holds id-token: write and signs the image, so a hijacked tag here
      # is worst-case. Bump the SHA (and the version comment) intentionally.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Fork PRs get a read-only token and must not publish, so logging in and
      # pushing are both gated on the event being a push to this repo.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Both arches build on every run, so an arch-specific break surfaces on
      # the PR causing it. Pushes to main publish :main and :latest; version
      # tags additionally publish semver. PRs build without publishing.
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Supply-chain attestations attached to the pushed image: a signed
          # provenance statement (how it was built) and an SBOM (what's in it).
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      # Keyless signature over the image digest, verifiable with:
      #   cosign verify ghcr.io/<owner>/thump@<digest> \
      #     --certificate-identity-regexp '^https://github.com/<owner>/thump/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the image with cosign
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"

  smoke:
    # The unit suite never starts the real container. This does: it boots the
    # image against a real config and drives a heartbeat from pending to down.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Build image (amd64 only — this job just runs it)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: thump:ci
          cache-from: type=gha

      - name: Boot and drive a heartbeat
        run: |
          set -euo pipefail
          mkdir -p /tmp/thump
          cat > /tmp/thump/config.yaml <<'YAML'
          store: {driver: sqlite, dsn: /var/lib/thump/state.db}
          server:
            listen: ":8080"
            secret: ${THUMP_SECRET}
            timezone: America/New_York
          checks:
            - name: nightly-backup
              type: heartbeat
              schedule: "0 2 * * *"
              grace: 30m
          YAML

          SECRET=ci-test-secret
          docker run -d --name thump -e THUMP_SECRET=$SECRET \
            -v /tmp/thump/config.yaml:/etc/thump/config.yaml:ro \
            -p 8080:8080 thump:ci

          for i in $(seq 1 30); do
            if curl -fsS localhost:8080/readyz >/dev/null 2>&1; then break; fi
            if [ "$i" = 30 ]; then docker logs thump; echo "never became ready"; exit 1; fi
            sleep 1
          done

          TOKEN=$(docker exec thump python -c \
            "from thump.tokens import derive_token; print(derive_token('$SECRET','nightly-backup'))")

          expect() {  # expect <label> <url> <status>
            got=$(curl -s -o /dev/null -w '%{http_code}' "$2")
            [ "$got" = "$3" ] || { echo "$1: expected $3, got $got"; docker logs thump; exit 1; }
            echo "$1: $got"
          }

          expect "pending is healthy" localhost:8080/status/nightly-backup 200
          curl -fsS "localhost:8080/ping/$TOKEN" >/dev/null
          expect "after ping"         localhost:8080/status/nightly-backup 200
          curl -fsS "localhost:8080/ping/$TOKEN/fail" >/dev/null
          expect "after fail ping"    localhost:8080/status/nightly-backup 503

      - name: Container logs on failure
        if: failure()
        run: docker logs thump || true
