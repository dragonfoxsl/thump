store:
  driver: sqlite              # sqlite | redis
  dsn: /var/lib/thump/state.db
  # For multi-replica Kubernetes, use Redis — SQLite silently breaks
  # correctness across replicas:
  # driver: redis
  # dsn: redis://redis:6379/0

server:
  listen: ":8080"
  secret: ${THUMP_SECRET}              # HMAC root for derived ping tokens
  # admin_token: uncomment and reference the THUMP_ADMIN_TOKEN env var here
  # (see README) to enable /checks and /metrics; omit this key to disable them
  timezone: UTC                         # display only; never affects evaluation

defaults:
  grace: 5m
  timeout: 10s
  history: 100
  failure_threshold: 2

checks:
  - name: nightly-db-backup
    type: heartbeat
    interval: 24h
    grace: 1h

  # Deadline anchored to when the job SHOULD run, not to when it was last seen.
  # Requires server.timezone; mutually exclusive with `interval`.
  - name: weekday-report
    type: heartbeat
    schedule: "0 6 * * 1-5"   # 06:00 on weekdays, in server.timezone
    grace: 30m

  - name: internal-payments-api
    type: probe
    url: http://payments.internal:8080/healthz
    interval: 60s
    expect_status: 200
